<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta name="theme-color" content="#0d3b40"><title>محاضرة | GS-AUH</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#143437;--teal:#0d4144;--mint:#dcece6;--muted:#607a78}*{box-sizing:border-box}body{margin:0;background:#eef4f0;font-family:Tajawal,Arial,sans-serif;color:var(--ink)}.header{background:#fff;box-shadow:0 2px 20px #113c3820}.header-inner{max-width:1300px;margin:auto;padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{color:var(--teal);text-decoration:none;font-weight:900;font-size:24px}.back{border:1px solid #cbdfd5;background:#f9fcfa;border-radius:10px;text-decoration:none;color:var(--teal);padding:9px 15px;font-weight:800}.container{max-width:1300px;margin:auto;padding:26px 24px}.heading{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}.heading h1{font-size:clamp(25px,3vw,36px);margin:3px 0}.heading p{margin:5px 0;color:var(--muted)}.tag{display:inline-block;color:#1f7564;background:#e0f0e9;border-radius:40px;padding:5px 12px;font-weight:900;font-size:12px}.panel{border:1px solid #cce0d6;border-radius:15px;overflow:hidden;background:white;min-height:75vh;box-shadow:0 10px 40px #123f3514}.panel iframe{display:block;border:0;width:100%;height:78vh;background:white}.notice{color:#896c35;background:#fff7e7;border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.9;margin:0 0 14px}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.action{background:var(--teal);border-radius:10px;color:#fff;text-decoration:none;padding:10px 15px;font-weight:800}.state{padding:40px;text-align:center;color:var(--muted)}[hidden]{display:none!important}@media(max-width:650px){.header-inner,.container{padding-inline:13px}.panel iframe{height:75vh}.heading{gap:8px}}
</style>
<script type="module" src="assets/lecture-viewer.js"></script>
</head>
<body>
<header class="header"><div class="header-inner"><a href="index.html" class="brand">✳ GS-AUH</a><a class="back" href="index.html#library">← مكتبة المحاضرات</a></div></header>
<main class="container">

<section class="panel"><div class="state" id="loading">جارٍ تحميل ملف المحاضرة…</div><iframe id="lectureFrame" title="محتوى المحاضرة" referrerpolicy="no-referrer" sandbox="allow-scripts" hidden></iframe></section>
</main>
